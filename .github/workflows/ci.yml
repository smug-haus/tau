name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  MIX_ENV: test
  ELIXIR_ERL_OPTIONS: "+fnu"
  # Smaller Hex retry / parallelism so flaky CDNs don't cascade-fail.
  HEX_HTTP_CONCURRENCY: "1"
  HEX_HTTP_TIMEOUT: "120"

jobs:
  lint:
    name: lint (format · credo · compile-warnings)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin Python 3.10 so :ex_termbox's waf 2.0.14 build compiles.
      # waf uses `import imp` (removed in 3.12) and `open(..., 'rUb')`
      # (universal-newlines mode 'U' removed in 3.11). Tracked as #136
      # territory; local devs use pyenv. ubuntu-24.04 ships 3.12 by default.
      - name: Setup Python (3.10 for ex_termbox waf)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Refresh CA certificates (builds.hex.pm TLS at Setup BEAM)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --only-upgrade ca-certificates
          sudo update-ca-certificates
      - name: Setup BEAM
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock', 'mix.exs') }}

      - run: mix deps.get 2>&1 | tee /tmp/deps.log
      - run: mix format --check-formatted 2>&1 | tee /tmp/format.log
      - run: mix compile --warnings-as-errors 2>&1 | tee /tmp/compile.log
        id: compile_step
        continue-on-error: true
      - name: Credo diff (blocking — new findings only)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          mix credo diff --strict --from-git-merge-base origin/main
      - run: mix credo --strict 2>&1 | tee /tmp/credo.log
        id: credo_step
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Gate 5.1 — AC-to-test linkage (blocking, PR events only)
      # Verifies every AC-N/D-NNN claimed in the PR body appears in a gating
      # test name or @tag. Skipped on push events (no PR body available).
      # -----------------------------------------------------------------------
      - name: Gate 5.1 — AC-to-test linkage
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Write PR body to a temp file
          gh pr view ${{ github.event.pull_request.number }} --json body --jq .body \
            > /tmp/pr-body.txt
          # Extract gating-test paths from the "Gating-test paths" section of the
          # PR body. Paths are listed as backtick-quoted items (e.g. `test/foo.exs`).
          GATING_FILES=$(grep -oP '(?<=`)[^`]+\.exs(?=`)' /tmp/pr-body.txt | sort -u || true)
          if [ -z "$GATING_FILES" ]; then
            echo "Gate 5.1: no gating-test paths declared in PR body — skipping."
            exit 0
          fi
          echo "Gating test paths: $GATING_FILES"
          # Verify each file exists
          for f in $GATING_FILES; do
            if [ ! -f "$f" ]; then
              echo "WARNING: declared gating test path '$f' not found — skipping gate."
              exit 0
            fi
          done
          mix tau.gate.ac_linkage /tmp/pr-body.txt $GATING_FILES

      # -----------------------------------------------------------------------
      # Gate 5.2 — Masking detection (detection-only, PR events only)
      # Scans the PR diff for removed assertions. Surfaces findings; never fails.
      # -----------------------------------------------------------------------
      - name: Gate 5.2 — Masking detection (detection-only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base origin/main HEAD)
          git diff "$BASE_SHA"..HEAD > /tmp/pr-diff.txt
          mix tau.gate.masking /tmp/pr-diff.txt || true
      - name: Push lint logs to ci-log branch on failure
        if: steps.compile_step.outcome == 'failure' || steps.credo_step.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          git config user.email "ci@local"
          git config user.name "ci"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          mkdir -p .ci-logs
          tail -300 /tmp/compile.log > .ci-logs/lint-compile.log || echo "no compile log"
          tail -300 /tmp/credo.log   > .ci-logs/lint-credo.log   || echo "no credo log"
          git checkout --orphan ci-log/lint 2>&1 || true
          git rm -rf --cached . 2>&1 || true
          git add -f .ci-logs/lint-compile.log .ci-logs/lint-credo.log
          git commit -m "ci-log: lint on ${{ github.sha }} (compile=${{ steps.compile_step.outcome }} credo=${{ steps.credo_step.outcome }})" 2>&1 || true
          git push origin ci-log/lint --force 2>&1 || true
      - name: Comment compile log on PR (on failure)
        if: steps.compile_step.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Lint job — compile failure on \`${{ github.sha }}\`"
            echo
            echo '```'
            tail -120 /tmp/compile.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md
      - name: Comment credo log on PR (on failure)
        if: steps.credo_step.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Lint job — credo --strict failure on \`${{ github.sha }}\`"
            echo
            echo '```'
            tail -120 /tmp/credo.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md
      - name: Fail the job if compile failed
        if: steps.compile_step.outcome == 'failure'
        run: exit 1
      - name: Fail the job if credo failed
        if: steps.credo_step.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Gate 5.3 — Mutation check (blocking, PR events only)
  # Keeps the declared gating-test paths at HEAD, reverts every other tracked
  # file to the merge-base, runs the gating tests, and asserts ≥1 fails.
  # A vacuous gating-test suite (all pass against base) fails CI.
  # ---------------------------------------------------------------------------
  mutation-check:
    name: mutation-check (Gate 5.3)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (3.10 for ex_termbox waf)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Refresh CA certificates (builds.hex.pm TLS at Setup BEAM)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --only-upgrade ca-certificates
          sudo update-ca-certificates
      - name: Setup BEAM
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-mutation-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock', 'mix.exs') }}

      - run: mix deps.get
      - run: mix compile

      - name: Gate 5.3 — Mutation check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Write PR body to a temp file and extract gating-test paths.
          gh pr view ${{ github.event.pull_request.number }} --json body --jq .body \
            > /tmp/pr-body.txt
          GATING_FILES=$(grep -oP '(?<=`)[^`]+\.exs(?=`)' /tmp/pr-body.txt | sort -u || true)
          if [ -z "$GATING_FILES" ]; then
            echo "Gate 5.3: no gating-test paths declared in PR body — skipping."
            exit 0
          fi
          echo "Gating test paths: $GATING_FILES"
          for f in $GATING_FILES; do
            if [ ! -f "$f" ]; then
              echo "WARNING: declared gating test path '$f' not found — skipping gate."
              exit 0
            fi
          done
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          BASE_REF=$(git merge-base origin/main HEAD)
          echo "Base ref (pre-implementer): $BASE_REF"
          mix tau.gate.mutation "$BASE_REF" $GATING_FILES

  test:
    name: test (Elixir ${{ matrix.elixir }} · OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.1"
            otp: "27.2"
          - elixir: "1.17.3"
            otp: "26.2"
    steps:
      - uses: actions/checkout@v4

      # Pin Python 3.10 so :ex_termbox's waf 2.0.14 build compiles.
      # waf uses `import imp` (removed in 3.12) and `open(..., 'rUb')`
      # (universal-newlines mode 'U' removed in 3.11). Tracked as #136
      # territory; local devs use pyenv. ubuntu-24.04 ships 3.12 by default.
      - name: Setup Python (3.10 for ex_termbox waf)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Refresh CA certificates (builds.hex.pm TLS at Setup BEAM)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --only-upgrade ca-certificates
          sudo update-ca-certificates
      - name: Setup BEAM
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock', 'mix.exs') }}

      - run: mix deps.get
      - run: mix compile
      - name: Run unit + integration tests
        id: test_step
        run: mix test --cover 2>&1 | tee /tmp/test.log
        continue-on-error: true
      - name: ALWAYS push test log to ci-log branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          echo "test_step outcome: ${{ steps.test_step.outcome }}"
          echo "test_step conclusion: ${{ steps.test_step.conclusion }}"
          echo "===== /tmp/test.log (tail 300) ====="
          tail -300 /tmp/test.log || true
          echo "===== end ====="
          git config user.email "ci@local"
          git config user.name "ci"
          git remote -v
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH="ci-log/test-${{ matrix.elixir }}"
          mkdir -p .ci-logs
          tail -300 /tmp/test.log > ".ci-logs/test-${{ matrix.elixir }}.log" || echo "no log"
          git checkout --orphan "$BRANCH" 2>&1 || true
          git rm -rf --cached . 2>&1 || true
          git add -f ".ci-logs/test-${{ matrix.elixir }}.log"
          git commit -m "ci-log: test ${{ matrix.elixir }} on ${{ github.sha }} (outcome=${{ steps.test_step.outcome }})" 2>&1 || true
          git push origin "$BRANCH" --force 2>&1 || true
          echo "Pushed log to branch $BRANCH"
      - name: Fail if tests failed
        if: steps.test_step.outcome == 'failure'
        run: exit 1
      - name: Run property suite
        run: mix test --only property --trace
        env:
          MIX_TEST_PROPERTY_BUDGET_FACTOR: "5"

      # Burrito release-build (used by the smoke gate below) needs
      # zig (cross-compiler driver) and xz (tarball compressor) on PATH.
      # Mirrors the release.yml workflow.
      #
      # `continue-on-error: true` on these three: when zig's CDN
      # mirrors are intermittently down (404/503), the gate becomes
      # informative-only rather than failing the entire test job. The
      # release workflow is the authoritative gate for the prod binary
      # actually building.
      - name: Setup Zig 0.15.2 (direct from ziglang.org)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLfo zig.tar.xz "https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz"
          tar -xf zig.tar.xz
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.15.2/zig" version
        continue-on-error: true

      - name: Setup xz (Burrito)
        run: sudo apt-get update && sudo apt-get install -y xz-utils
        continue-on-error: true

      - name: Run binary smoke gate (AC-5 / SPEC-USER-TURN)
        # Builds the host-architecture Burrito binary and runs
        # `tau run "ping" --provider replay --model replay`. Per
        # docs/spec/SPEC-USER-TURN.md AC-5. Marked continue-on-error
        # because zig CDN outages would otherwise fail the test job
        # even when the unit suite is green; release.yml is the
        # authoritative binary-build gate.
        run: mix test --only smoke --include smoke --trace
        continue-on-error: true

      - name: Upload coverage
        if: matrix.elixir == '1.18.1'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.elixir }}-${{ matrix.otp }}
          path: cover/
          if-no-files-found: ignore

  dialyzer:
    name: dialyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pin Python 3.10 so :ex_termbox's waf 2.0.14 build compiles.
      # waf uses `import imp` (removed in 3.12) and `open(..., 'rUb')`
      # (universal-newlines mode 'U' removed in 3.11). Tracked as #136
      # territory; local devs use pyenv. ubuntu-24.04 ships 3.12 by default.
      - name: Setup Python (3.10 for ex_termbox waf)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Refresh CA certificates (builds.hex.pm TLS at Setup BEAM)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --only-upgrade ca-certificates
          sudo update-ca-certificates
      - name: Setup BEAM
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock', 'mix.exs') }}

      - name: Cache PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock', 'mix.exs') }}

      - run: mix deps.get
      - run: mix compile
      - name: Build PLTs (only when missing)
        run: mkdir -p priv/plts && mix dialyzer --plt 2>&1 | tee /tmp/plt.log
      - name: Run dialyzer
        id: dialyzer_step
        run: mix dialyzer --format github 2>&1 | tee /tmp/dialyzer.log
        continue-on-error: true
      - name: Comment dialyzer log on PR (on failure)
        if: steps.dialyzer_step.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## dialyzer — failure on \`${{ github.sha }}\`"
            echo
            echo '```'
            tail -120 /tmp/dialyzer.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md
      - name: Fail if dialyzer failed
        if: steps.dialyzer_step.outcome == 'failure'
        run: exit 1

  binary-qa:
    name: binary-qa (mix tau.qa · linux_amd64)
    # Closing-move QA gate — issue #268. Supersedes the prior
    # `binary-smoke` job (#262): runs all six layers (source quality,
    # artifact build, artifact boot, replay smoke, tool-exposure smoke,
    # coordinator round-trip) in `mix tau.qa`. The unit suite cannot
    # catch a non-functional binary nor a broken in-memory tool surface;
    # this job can. Path-filtered so docs-only PRs are not blocked on a
    # multi-minute release build. (#269 will tighten the filter.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          # Positive-trigger filter: `build: true` when at least one changed
          # path matches a pattern below. Pure-docs paths (docs/**, *.md,
          # *.org, LICENSE, CHANGELOG.md, .gitignore) are simply not listed,
          # so they never flip `build` to true.
          #
          # Four-case verification (issue #269):
          #   1. Edit only docs/m1-verification/README.md   → no match → SKIP ✓
          #   2. Edit only priv/skills/tau-coordinator/SKILL.md
          #                                                 → priv/** matches → RUN ✓
          #      (This was the silent-skip bug fixed by this PR.)
          #   3. Edit lib/tau/cli.ex + test/tau/cli/foo_test.exs
          #                                                 → lib/** and test/** match → RUN ✓
          #   4. Edit only README.md                        → no match → SKIP ✓
          filters: |
            build:
              - 'lib/**'
              - 'mix.exs'
              - 'mix.lock'
              - 'priv/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'test/**'
              - 'config/**'

      - name: Setup Python (3.10 for ex_termbox waf)
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Refresh CA certificates (builds.hex.pm TLS at Setup BEAM)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --only-upgrade ca-certificates
          sudo update-ca-certificates
      - name: Setup BEAM
        if: steps.changes.outputs.build == 'true'
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Setup Zig 0.15.2 (direct from ziglang.org)
        if: steps.changes.outputs.build == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLfo zig.tar.xz "https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz"
          tar -xf zig.tar.xz
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.15.2/zig" version

      - name: Setup xz and tmux (Burrito + TUI UX protocol)
        if: steps.changes.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y xz-utils tmux

      - name: Cache deps
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-binary-qa-${{ hashFiles('**/mix.lock', 'mix.exs') }}

      - name: Fetch deps
        if: steps.changes.outputs.build == 'true'
        run: mix deps.get

      - name: Fetch origin/main (for tau.qa credo-diff layer)
        if: steps.changes.outputs.build == 'true'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: mix tau.qa
        if: steps.changes.outputs.build == 'true'
        run: mix tau.qa
        env:
          BURRITO_TARGET: linux_amd64

      - name: mix tau.tui_ux (TUI UX protocol gate — closes #336)
        # Runs the tmux-driven TUI UX protocol (SPEC-TUI-HEADLESS §7 steps 1–3).
        # tau.qa already built the binary; tau.tui_ux locates it via the
        # pre-built path and skips the build. tmux was installed above.
        # Blocking (no continue-on-error): a TUI protocol failure is CI-blocking.
        #
        # Note: tau.tui_ux runs `mix test` under MIX_ENV=test (the default).
        # tau.qa ran under MIX_ENV=prod; switching env forces a full test-env
        # recompile here (~30s on a cold cache). This is expected and unavoidable
        # given ExUnit requires MIX_ENV=test.
        if: steps.changes.outputs.build == 'true'
        run: mix tau.tui_ux
        env:
          BURRITO_TARGET: linux_amd64

      - name: Note skip on docs-only PR
        if: steps.changes.outputs.build != 'true'
        run: |
          echo "binary-qa skipped: docs-only diff"

  escript:
    name: escript build
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      # Pin Python 3.10 so :ex_termbox's waf 2.0.14 build compiles.
      # waf uses `import imp` (removed in 3.12) and `open(..., 'rUb')`
      # (universal-newlines mode 'U' removed in 3.11). Tracked as #136
      # territory; local devs use pyenv. ubuntu-24.04 ships 3.12 by default.
      - name: Setup Python (3.10 for ex_termbox waf)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Refresh CA certificates (builds.hex.pm TLS at Setup BEAM)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --only-upgrade ca-certificates
          sudo update-ca-certificates
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: mix deps.get
      - run: MIX_ENV=prod mix escript.build
      - name: Sanity-run the escript
        run: ./tau version
        env:
          ELIXIR_ERL_OPTIONS: "+fnu"

      - uses: actions/upload-artifact@v4
        with:
          name: tau-escript
          path: tau
          retention-days: 7

  # ---------------------------------------------------------------------------
  # web job — :tau_web Phoenix poncho package (issue #374 / M7 foundation)
  # Separate from the core :tau jobs so M7 and M1.1 can proceed in parallel
  # without entangling their CI timelines.
  # ---------------------------------------------------------------------------
  web:
    name: web (tau_web poncho · compile + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pin Python 3.10 so :ex_termbox's waf 2.0.14 build compiles.
      # The :tau path-dep pulls in ex_termbox; same constraint applies.
      - name: Setup Python (3.10 for ex_termbox waf)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Refresh CA certificates (builds.hex.pm TLS at Setup BEAM)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --only-upgrade ca-certificates
          sudo update-ca-certificates
      - name: Setup BEAM
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps (web)
        uses: actions/cache@v4
        with:
          path: |
            web/deps
            web/_build
          key: ${{ runner.os }}-mix-web-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('web/mix.lock', 'web/mix.exs', 'mix.lock', 'mix.exs') }}

      - name: Install web deps
        run: cd web && mix deps.get

      - name: Compile (warnings-as-errors)
        run: cd web && mix compile --warnings-as-errors

      - name: Run tests
        run: cd web && mix test
