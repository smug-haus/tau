name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_ERL_OPTIONS: "+fnu"
  # Smaller Hex retry / parallelism so flaky CDNs don't cascade-fail.
  HEX_HTTP_CONCURRENCY: "1"
  HEX_HTTP_TIMEOUT: "120"

jobs:
  lint:
    name: lint (format · credo · compile-warnings)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup BEAM
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get 2>&1 | tee /tmp/deps.log
      - run: mix format --check-formatted 2>&1 | tee /tmp/format.log
      - run: mix compile --warnings-as-errors 2>&1 | tee /tmp/compile.log
        continue-on-error: true
      - name: dump compile log on failure
        if: always()
        run: |
          echo "===== compile.log ====="
          cat /tmp/compile.log || true
          echo "===== deps.log ====="
          cat /tmp/deps.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-logs
          path: /tmp/*.log
          if-no-files-found: ignore
      - run: mix credo --strict || true

  test:
    name: test (Elixir ${{ matrix.elixir }} · OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.1"
            otp: "27.2"
          - elixir: "1.17.3"
            otp: "26.2"
    steps:
      - uses: actions/checkout@v4

      - name: Setup BEAM
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get 2>&1 | tee /tmp/deps.log
      - run: mix compile 2>&1 | tee /tmp/compile.log
      - name: dump compile log on failure
        if: always()
        run: |
          echo "===== compile.log (head) ====="
          head -200 /tmp/compile.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-compile-logs-${{ matrix.elixir }}
          path: /tmp/*.log
          if-no-files-found: ignore
      - name: Run unit + integration tests
        run: mix test --cover 2>&1 | tee /tmp/test.log
        continue-on-error: true
      - name: dump test log
        if: always()
        run: |
          echo "===== test.log (tail) ====="
          tail -200 /tmp/test.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-${{ matrix.elixir }}
          path: /tmp/test.log
          if-no-files-found: ignore
      - name: Run property suite
        run: mix test --only property --trace 2>&1 | tee /tmp/prop.log
        continue-on-error: true
        env:
          MIX_TEST_PROPERTY_BUDGET_FACTOR: "5"

      - name: Upload coverage
        if: matrix.elixir == '1.18.1'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.elixir }}-${{ matrix.otp }}
          path: cover/
          if-no-files-found: ignore

  dialyzer:
    name: dialyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup BEAM
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get 2>&1 | tee /tmp/deps.log
      - run: mix compile 2>&1 | tee /tmp/compile.log
      - name: Build PLTs (only when missing)
        run: mkdir -p priv/plts && mix dialyzer --plt 2>&1 | tee /tmp/plt.log
        continue-on-error: true
      - run: mix dialyzer --format github 2>&1 | tee /tmp/dialyzer.log
        continue-on-error: true
      - name: dump dialyzer logs
        if: always()
        run: |
          echo "===== compile.log (head) ====="
          head -100 /tmp/compile.log || true
          echo "===== plt.log (tail) ====="
          tail -100 /tmp/plt.log || true
          echo "===== dialyzer.log (tail) ====="
          tail -100 /tmp/dialyzer.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dialyzer-logs
          path: /tmp/*.log
          if-no-files-found: ignore

  escript:
    name: escript build
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: mix deps.get 2>&1 | tee /tmp/deps.log
      - run: MIX_ENV=prod mix escript.build 2>&1 | tee /tmp/build.log
        continue-on-error: true
      - name: Sanity-run the escript
        run: ./tau version 2>&1 | tee /tmp/run.log
        continue-on-error: true
        env:
          ELIXIR_ERL_OPTIONS: "+fnu"
      - name: dump escript logs
        if: always()
        run: |
          echo "===== build.log ====="
          cat /tmp/build.log || true
          echo "===== run.log ====="
          cat /tmp/run.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escript-logs
          path: |
            /tmp/*.log
            tau
          retention-days: 7
          if-no-files-found: ignore
